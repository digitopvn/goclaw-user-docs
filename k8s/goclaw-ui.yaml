---
# ConfigMap — goclaw-ui runtime config
apiVersion: v1
kind: ConfigMap
metadata:
    name: goclaw-ui-config
    namespace: goclaw
    labels:
        app: goclaw-ui
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        workspace: topgroup
data:
    # Points to the internal goclaw gateway service
    GOCLAW_API_URL: "http://goclaw:18790"
---
# Deployment — goclaw web dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
    name: goclaw-ui
    namespace: goclaw
    labels:
        app: goclaw-ui
        app-version: goclaw-ui-1
        deploy-strategy: v2
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        updated-by: tam-lam
        workspace: topgroup
spec:
    replicas: 1
    minReadySeconds: 10
    revisionHistoryLimit: 10
    progressDeadlineSeconds: 600
    selector:
        matchLabels:
            app: goclaw-ui
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 1
            maxSurge: 1
    template:
        metadata:
            labels:
                app: goclaw-ui
                app-version: goclaw-ui-1
                deploy-strategy: v2
                main-app: goclaw
                owner: tam-lam
                phase: live
                project: goclaw
                updated-by: tam-lam
                workspace: topgroup
        spec:
            imagePullSecrets:
                - name: digitopdockerhub-docker-registry-key
            initContainers:
                # Wait for goclaw gateway to be ready before starting UI
                - name: wait-for-goclaw
                  image: busybox:1.36
                  command:
                      - sh
                      - -c
                      - |
                          until nc -z goclaw 18790; do
                            echo "Waiting for goclaw..."; sleep 3;
                          done
            containers:
                - name: goclaw-ui
                  image: ghcr.io/nextlevelbuilder/goclaw-web:latest
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 80
                        protocol: TCP
                  envFrom:
                      - configMapRef:
                            name: goclaw-ui-config
                  resources:
                      requests:
                          memory: "64Mi"
                          cpu: "50m"
                      limits:
                          memory: "256Mi"
                          cpu: "500m"
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 80
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 80
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
                  terminationMessagePath: /dev/termination-log
                  terminationMessagePolicy: File
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
            dnsPolicy: ClusterFirst
            securityContext: {}
            schedulerName: default-scheduler
---
# Service — goclaw-ui ClusterIP
apiVersion: v1
kind: Service
metadata:
    name: goclaw-ui
    namespace: goclaw
    labels:
        app: goclaw-ui
        app-version: goclaw-ui-1
        deploy-strategy: v2
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        updated-by: tam-lam
        workspace: topgroup
spec:
    type: ClusterIP
    sessionAffinity: ClientIP
    sessionAffinityConfig:
        clientIP:
            timeoutSeconds: 10800
    selector:
        app: goclaw-ui
    ports:
        - port: 80
          targetPort: 80
          protocol: TCP
---
# Ingress — goclaw web dashboard (HTTPS via cert-manager + nginx)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: goclaw-ui
    namespace: goclaw
    labels:
        app: goclaw-ui
        app-version: goclaw-ui-1
        deploy-strategy: v2
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        updated-by: tam-lam
        workspace: topgroup
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/limit-rps: "200"
        nginx.ingress.kubernetes.io/proxy-body-size: 100m
        nginx.ingress.kubernetes.io/server-snippet: |
            location ~ /\.git { deny all; return 403; }
            location ~ /\.env { deny all; return 403; }
spec:
    ingressClassName: nginx
    tls:
        - hosts:
              - goclaw-demo-kislee.diginext.site
          secretName: tls-app-goclaw-demo-kislee-diginext-site
    rules:
        - host: goclaw-demo-kislee.diginext.site
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: goclaw-ui
                            port:
                                number: 80
