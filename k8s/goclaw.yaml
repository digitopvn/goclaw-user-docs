---
# Secret — goclaw credentials (base64-encoded; replace values before applying)
# echo -n 'your-value' | base64
apiVersion: v1
kind: Secret
metadata:
    name: goclaw-secret
    namespace: goclaw
    labels:
        app: goclaw
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        workspace: topgroup
type: Opaque
data:
    # openssl rand -hex 32 | base64
    GOCLAW_GATEWAY_TOKEN: cmVwbGFjZS10aGlzLWdhdGV3YXktdG9rZW4=
    # openssl rand -hex 16 | base64
    GOCLAW_ENCRYPTION_KEY: cmVwbGFjZS10aGlzLWtleQ==
    # postgres://goclaw:<password>@postgres:5432/goclaw?sslmode=disable  — base64-encoded
    GOCLAW_POSTGRES_DSN: cG9zdGdyZXM6Ly9nb2NsYXc6Z29jbGF3QHBvc3RncmVzOjE4NzkyL2dvY2xhdz9zc2xtb2RlPWRpc2FibGU=
---
# ConfigMap — non-sensitive goclaw runtime config
apiVersion: v1
kind: ConfigMap
metadata:
    name: goclaw-config
    namespace: goclaw
    labels:
        app: goclaw
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        workspace: topgroup
data:
    GOCLAW_HOST: "0.0.0.0"
    GOCLAW_PORT: "18790"
    GOCLAW_CONFIG: "/app/data/config.json"
    GOCLAW_SKILLS_DIR: "/app/data/skills"
    GOCLAW_AUTO_UPGRADE: "true"
---
# PersistentVolumeClaim — goclaw app data (/app/data)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: goclaw-data-pvc
    namespace: goclaw
    labels:
        app: goclaw
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        workspace: topgroup
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
---
# PersistentVolumeClaim — goclaw workspace (/app/workspace)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: goclaw-workspace-pvc
    namespace: goclaw
    labels:
        app: goclaw
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        workspace: topgroup
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi
---
# Deployment — goclaw gateway
apiVersion: apps/v1
kind: Deployment
metadata:
    name: goclaw
    namespace: goclaw
    labels:
        app: goclaw
        app-version: goclaw-1
        deploy-strategy: v2
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        updated-by: tam-lam
        workspace: topgroup
spec:
    replicas: 1
    minReadySeconds: 10
    revisionHistoryLimit: 10
    progressDeadlineSeconds: 600
    selector:
        matchLabels:
            app: goclaw
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    template:
        metadata:
            labels:
                app: goclaw
                app-version: goclaw-1
                deploy-strategy: v2
                main-app: goclaw
                owner: tam-lam
                phase: live
                project: goclaw
                updated-by: tam-lam
                workspace: topgroup
        spec:
            imagePullSecrets:
                - name: digitopdockerhub-docker-registry-key
            initContainers:
                # Wait for postgres to be ready before starting goclaw
                - name: wait-for-postgres
                  image: busybox:1.36
                  command:
                      - sh
                      - -c
                      - |
                          until nc -z postgres 5432; do
                            echo "Waiting for postgres..."; sleep 3;
                          done
            containers:
                - name: goclaw
                  image: ghcr.io/nextlevelbuilder/goclaw:latest
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 18790
                        protocol: TCP
                  envFrom:
                      - configMapRef:
                          name: goclaw-config
                      - secretRef:
                          name: goclaw-secret
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "100m"
                      limits:
                          memory: "1Gi"
                          cpu: "1000m"
                  volumeMounts:
                      - name: goclaw-data
                        mountPath: /app/data
                      - name: goclaw-workspace
                        mountPath: /app/workspace
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 18790
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 18790
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                          add:
                              - SETUID
                              - SETGID
                              - CHOWN
                  terminationMessagePath: /dev/termination-log
                  terminationMessagePolicy: File
            volumes:
                - name: goclaw-data
                  persistentVolumeClaim:
                      claimName: goclaw-data-pvc
                - name: goclaw-workspace
                  persistentVolumeClaim:
                      claimName: goclaw-workspace-pvc
            restartPolicy: Always
            terminationGracePeriodSeconds: 120
            dnsPolicy: ClusterFirst
            securityContext: {}
            schedulerName: default-scheduler
---
# Service — goclaw gateway ClusterIP
apiVersion: v1
kind: Service
metadata:
    name: goclaw
    namespace: goclaw
    labels:
        app: goclaw
        app-version: goclaw-1
        deploy-strategy: v2
        main-app: goclaw
        owner: tam-lam
        phase: live
        project: goclaw
        updated-by: tam-lam
        workspace: topgroup
spec:
    type: ClusterIP
    sessionAffinity: ClientIP
    sessionAffinityConfig:
        clientIP:
            timeoutSeconds: 10800
    selector:
        app: goclaw
    ports:
        - port: 18790
          targetPort: 18790
          protocol: TCP