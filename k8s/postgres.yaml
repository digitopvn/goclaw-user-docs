---
# Secret — postgres credentials (base64-encoded; replace values before applying)
# echo -n 'goclaw' | base64  →  Z29jbGF3
apiVersion: v1
kind: Secret
metadata:
    name: postgres-secret
    namespace: goclaw
    labels:
        app: postgres
        main-app: docs
        owner: tam-lam
        phase: live
        project: goclaw
        workspace: topgroup
type: Opaque
data:
    POSTGRES_USER: Z29jbGF3         # goclaw
    POSTGRES_PASSWORD: Z29jbGF3     # goclaw  ← change this
    POSTGRES_DB: Z29jbGF3           # goclaw
---
# ConfigMap — non-sensitive postgres config
apiVersion: v1
kind: ConfigMap
metadata:
    name: postgres-config
    namespace: goclaw
    labels:
        app: postgres
        main-app: docs
        owner: tam-lam
        phase: live
        project: goclaw
        workspace: topgroup
data:
    PGPORT: "5432"
---
# StatefulSet — pgvector/pgvector:pg18 with persistent volume
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres
    namespace: goclaw
    labels:
        app: postgres
        app-version: postgres-1
        deploy-strategy: v2
        main-app: docs
        owner: tam-lam
        phase: live
        project: goclaw
        updated-by: tam-lam
        workspace: topgroup
spec:
    serviceName: postgres
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
                app-version: postgres-1
                deploy-strategy: v2
                main-app: docs
                owner: tam-lam
                phase: live
                project: goclaw
                updated-by: tam-lam
                workspace: topgroup
        spec:
            imagePullSecrets:
                - name: digitopdockerhub-docker-registry-key
            containers:
                - name: postgres
                  image: pgvector/pgvector:pg18
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 5432
                        protocol: TCP
                  envFrom:
                      - secretRef:
                          name: postgres-secret
                      - configMapRef:
                          name: postgres-config
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "100m"
                      limits:
                          memory: "1Gi"
                          cpu: "1000m"
                  volumeMounts:
                      - name: postgres-data
                        mountPath: /var/lib/postgresql/data
                        subPath: pgdata
                  livenessProbe:
                      exec:
                          command:
                              - pg_isready
                              - -U
                              - goclaw
                              - -d
                              - goclaw
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6
                  readinessProbe:
                      exec:
                          command:
                              - pg_isready
                              - -U
                              - goclaw
                              - -d
                              - goclaw
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
                  terminationMessagePath: /dev/termination-log
                  terminationMessagePolicy: File
            restartPolicy: Always
            terminationGracePeriodSeconds: 60
            dnsPolicy: ClusterFirst
            securityContext:
                fsGroup: 999
            schedulerName: default-scheduler
    volumeClaimTemplates:
        - metadata:
              name: postgres-data
          spec:
              accessModes:
                  - ReadWriteOnce
              resources:
                  requests:
                      storage: 10Gi
---
# Service — ClusterIP on standard port 5432 (no host port conflict in k8s)
apiVersion: v1
kind: Service
metadata:
    name: postgres
    namespace: goclaw
    labels:
        app: postgres
        app-version: postgres-1
        deploy-strategy: v2
        main-app: docs
        owner: tam-lam
        phase: live
        project: goclaw
        updated-by: tam-lam
        workspace: topgroup
spec:
    type: ClusterIP
    selector:
        app: postgres
    ports:
        - port: 5432
          targetPort: 5432
          protocol: TCP
